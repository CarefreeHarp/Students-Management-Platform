spring.application.name=StudyFlow

spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]
# La base predeterminada existe en memoria mientras se ejecuta el backend.
spring.datasource.url=${STUDYFLOW_H2_URL:jdbc:h2:mem:studyflow}
spring.datasource.username=${STUDYFLOW_H2_USER:sa}
spring.datasource.password=${STUDYFLOW_H2_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
spring.web.resources.add-mappings=false

server.port=${PORT:6767}
server.error.include-message=never
server.forward-headers-strategy=none
server.servlet.session.cookie.path=/api/admin
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.http-only=true
studyflow.admin.enabled=false
studyflow.auth.jwt-key=${STUDYFLOW_JWT_KEY:}
studyflow.auth.secure-cookie=${STUDYFLOW_SECURE_COOKIE:true}
studyflow.demo.enabled=${STUDYFLOW_DEMO_ENABLED:true}
studyflow.demo.password=${STUDYFLOW_DEMO_PASSWORD:StudyFlowDemo2026!}

# ---------------------------------------------------------------------------
# Recordatorios por WhatsApp (Cloud API de Meta)
# Con enabled=false la pasarela funciona en modo simulacion: escribe el mensaje
# en el log en lugar de llamar a Meta. Rellena token y phone-number-id desde el
# panel de desarrolladores de Meta y pon enabled=true para enviar de verdad.
# ---------------------------------------------------------------------------
studyflow.whatsapp.enabled=false
studyflow.whatsapp.token=${WHATSAPP_TOKEN:}
studyflow.whatsapp.phone-number-id=${WHATSAPP_PHONE_ID:}
studyflow.whatsapp.api-version=v21.0

# Cada cuanto se revisa la cola de recordatorios pendientes (milisegundos)
studyflow.recordatorios.intervalo-ms=60000

# ---------------------------------------------------------------------------
# Asistente conversacional (API de OpenAI)
# Con enabled=false se usa ClienteIaSimulado y no se realiza ninguna llamada
# externa. Al activarlo, ClienteIaOpenAi lo sustituye automaticamente.
# ---------------------------------------------------------------------------
studyflow.ia.enabled=false
studyflow.ia.api-key=${OPENAI_API_KEY:}
studyflow.ia.modelo=gpt-4o-mini

studyflow.archivos.ruta=${STUDYFLOW_ARCHIVOS_RUTA:../archivos}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
