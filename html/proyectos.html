<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Gestiona tus proyectos académicos en Atempo.">
    <title>Mis proyectos · Atempo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/estilos-generales.css">
    <link rel="stylesheet" href="../css/proyectos.css">
  </head>
  <body class="app-page projects-page" data-page="proyectos">
    <div id="main-nav"></div>

    <main class="app-main projects-main">
      <section class="page-hero projects-hero" aria-labelledby="projects-title">
        <div>
          <p class="eyebrow"><i class="bi bi-kanban"></i> Espacio de trabajo</p>
          <h1 id="projects-title">Mis proyectos</h1>
          <p class="hero-copy">Visualiza el avance de cada entrega y continúa donde lo dejaste.</p>
        </div>
        <a class="button button-primary hero-action" href="crear-proyecto.html">
          <i class="bi bi-plus-lg" aria-hidden="true"></i> Crear proyecto
        </a>
      </section>

      <section class="projects-summary" aria-label="Resumen de proyectos">
        <article class="summary-card summary-card--violet">
          <span class="summary-icon"><i class="bi bi-collection"></i></span>
          <div><strong id="total-projects">0</strong><span>proyectos activos</span></div>
        </article>
        <article class="summary-card summary-card--blue">
          <span class="summary-icon"><i class="bi bi-check2-circle"></i></span>
          <div><strong id="completed-tasks">0</strong><span>tareas completadas</span></div>
        </article>
        <article class="summary-card summary-card--orange">
          <span class="summary-icon"><i class="bi bi-calendar-event"></i></span>
          <div><strong id="next-deadline">—</strong><span>próxima entrega</span></div>
        </article>
      </section>

      <section class="projects-toolbar" aria-label="Herramientas de proyectos">
        <label class="search-field" for="project-search">
          <i class="bi bi-search" aria-hidden="true"></i>
          <span class="sr-only">Buscar proyecto</span>
          <input id="project-search" type="search" autocomplete="off" placeholder="Buscar por nombre o integrante">
        </label>
        <div class="filter-buttons" role="group" aria-label="Filtrar proyectos">
          <button class="filter-button is-active" type="button" data-filter="all">Todos</button>
          <button class="filter-button" type="button" data-filter="active">En curso</button>
          <button class="filter-button" type="button" data-filter="completed">Finalizados</button>
        </div>
      </section>

      <section class="project-grid-section" aria-labelledby="project-grid-title">
        <div class="section-heading">
          <h2 id="project-grid-title">Tus espacios de trabajo</h2>
          <span id="project-count-label" class="muted-label">0 proyectos</span>
        </div>
        <div id="projects-grid" class="projects-grid" aria-live="polite"></div>
      </section>
    </main>

    <template id="project-card-template">
      <article class="project-card">
        <a class="project-card-link" href="#" aria-label="Abrir proyecto">
          <div class="project-card-topline">
            <span class="project-color-dot"></span>
            <span class="project-state"></span>
            <i class="bi bi-arrow-up-right" aria-hidden="true"></i>
          </div>
          <h3 class="project-name"></h3>
          <p class="project-description"></p>
          <div class="project-meta">
            <span><i class="bi bi-calendar3"></i><time class="project-deadline"></time></span>
            <span><i class="bi bi-list-check"></i><span class="project-task-count"></span></span>
          </div>
          <div class="project-progress-copy"><span>Avance total</span><strong class="project-progress-value"></strong></div>
          <div class="progress-track" aria-hidden="true"><span class="progress-fill"></span></div>
          <div class="project-card-footer">
            <div class="member-stack" aria-label="Integrantes"></div>
            <span class="open-project">Ver proyecto <i class="bi bi-arrow-right"></i></span>
          </div>
        </a>
      </article>
    </template>

    <script src="../js/main.js" defer></script>
    <script src="../js/proyectos.js" defer></script>
  </body>
</html>
