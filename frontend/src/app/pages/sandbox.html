<header class="sandbox-bar">
<p class="sandbox-label"><span class="sandbox-dot"></span>{{ t('sandbox.en_este_momento_te_encuentras_en_una_prueba') }}</p>
<nav aria-label="{{ t('sandbox.opciones_de_la_prueba') }}"><button id="sandbox-theme" type="button" aria-pressed="true">{{ t('sandbox.cambiar_a_modo_claro') }}</button><button id="sandbox-reset">{{ t('sandbox.reiniciar') }}</button><button id="sandbox-register" class="sandbox-primary">{{ t('invitacion.crear_cuenta') }}</button><a href="/login" id="sandbox-exit">{{ t('sandbox.salir_del_recorrido_inicial') }}</a></nav>
</header>
<main id="sandbox-stage" aria-label="{{ t('sandbox.aplicacion_de_prueba') }}"></main>

<noscript>{{ t('sandbox.activa_javascript_para_usar_el_espacio_de_prueba') }} <a href="/login">{{ t('login.volver') }}</a></noscript>
