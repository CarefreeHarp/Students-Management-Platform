<a class="skip-link" href="#contenido">{{ t('canales.ir_al_contenido') }}</a>
<header id="main-nav" class="app-nav"></header>

<main id="contenido" class="page-shell">
  <section class="page-heading" aria-labelledby="projects-title">
    <div>
      <h1 id="projects-title">{{ t('proyectos.mis_proyectos') }}</h1>
      <p id="total-projects" class="mt-2 text-muted" aria-live="polite">{{ t('proyectos.cargando_proyectos') }}</p>
    </div>
    <a class="btn btn-primary" href="/proyectos/nuevo">
      <i class="bi bi-plus-lg" aria-hidden="true"></i> {{ t('proyectos.crear_proyecto') }}
    </a>
  </section>

  <section class="mb-5 flex flex-wrap items-center justify-between gap-3" aria-label="{{ t('proyectos.herramientas_de_proyectos') }}">
    <label class="input-wrap w-[min(340px,100%)]" for="project-search">
      <i class="bi bi-search" aria-hidden="true"></i>
      <span class="sr-only">{{ t('proyectos.buscar_proyecto') }}</span>
      <input id="project-search" type="search" autocomplete="off" placeholder="{{ t('proyectos.buscar_por_nombre_o_integrante') }}">
    </label>
    <div class="flex gap-1.5 rounded-[12px] border border-line bg-[var(--superficie)] p-1" role="group" aria-label="{{ t('proyectos.filtrar_proyectos') }}">
      <button class="filter-button is-active" type="button" data-filter="all">{{ t('proyectos.todos') }}</button>
      <button class="filter-button" type="button" data-filter="active">{{ t('proyectos.en_curso') }}</button>
      <button class="filter-button" type="button" data-filter="completed">{{ t('proyectos.finalizados') }}</button>
    </div>
  </section>

  <section aria-labelledby="project-grid-title">
    <div class="section-heading">
      <div><h2 id="project-grid-title">{{ t('landing.tus_proyectos') }}</h2><p class="project-list-help">{{ t('proyectos.abre_un_proyecto_para_ver_sus_tareas_entregas') }}</p></div>
      <span id="project-count-label" class="text-[13px] text-muted">{{ t('proyectos.0_proyectos') }}</span>
    </div>
    <div id="projects-grid" class="projects-grid" aria-live="polite"></div>
  </section>
</main>

<template id="project-card-template">
  <article class="project-card">
    <a class="project-card-link block" href="#" aria-label="{{ t('proyectos.abrir_proyecto') }}">
      <div class="project-card-topline">
        <span class="project-color-dot"></span>
        <span class="project-state"></span>
        <i class="bi bi-arrow-up-right" aria-hidden="true"></i>
      </div>
      <h3 class="project-name"></h3>
      <p class="project-description"></p>
      <div class="project-meta">
        <span class="project-delivery"><i class="bi bi-calendar3" aria-hidden="true"></i><time class="project-deadline"></time></span>
        <span><i class="bi bi-list-check"></i><span class="project-task-count"></span></span>
      </div>
      <div class="project-progress-copy"><span>{{ t('proyectos.avance_total') }}</span><strong class="project-progress-value"></strong></div>
      <div class="progress-track" aria-hidden="true"><span class="progress-fill"></span></div>
      <div class="project-card-footer">
        <div class="member-stack" aria-label="{{ t('crear_proyecto.integrantes') }}"></div>
        <span class="open-project">{{ t('proyectos.ver_proyecto') }} <i class="bi bi-arrow-right"></i></span>
      </div>
    </a>
  </article>
</template>
