spring.application.name=StudyFlow

# ---------------------------------------------------------------------------
# Base de datos MySQL (perfil por defecto)
# Crea el esquema con: mysql -u root -p < src/main/resources/db/mysql/schema.sql
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/studyflow?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:studyflow}
spring.datasource.password=${DB_PASSWORD:studyflow}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# ---------------------------------------------------------------------------
# Vista (Thymeleaf) e Interfaz (recursos estaticos)
# ---------------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.web.resources.static-locations=classpath:/static/

# ---------------------------------------------------------------------------
# Huella de contenido en los recursos estaticos.
# Thymeleaf publica /css/app.css como /css/app-<hash>.css, donde el hash sale
# del contenido del archivo. Al recompilar los estilos cambia la direccion, de
# modo que el navegador descarga la version nueva sin tener que forzar la
# recarga: era la causa de seguir viendo el diseno anterior tras un cambio.
# ---------------------------------------------------------------------------
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**

server.port=6767
server.error.include-message=always

# ---------------------------------------------------------------------------
# Recordatorios por WhatsApp (Cloud API de Meta)
# Con enabled=false la pasarela funciona en modo simulacion: escribe el mensaje
# en el log en lugar de llamar a Meta. Rellena token y phone-number-id desde el
# panel de desarrolladores de Meta y pon enabled=true para enviar de verdad.
# ---------------------------------------------------------------------------
studyflow.whatsapp.enabled=false
studyflow.whatsapp.token=${WHATSAPP_TOKEN:}
studyflow.whatsapp.phone-number-id=${WHATSAPP_PHONE_ID:}
studyflow.whatsapp.api-version=v21.0

# Cada cuanto se revisa la cola de recordatorios pendientes (milisegundos)
studyflow.recordatorios.intervalo-ms=60000

# ---------------------------------------------------------------------------
# Asistente conversacional (API de OpenAI)
# Con enabled=false se usa ClienteIaSimulado y no se realiza ninguna llamada
# externa. Al activarlo, ClienteIaOpenAi lo sustituye automaticamente.
# ---------------------------------------------------------------------------
studyflow.ia.enabled=false
studyflow.ia.api-key=${OPENAI_API_KEY:}
studyflow.ia.modelo=gpt-4o-mini
