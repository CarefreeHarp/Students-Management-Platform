<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head('Inicio', 'StudyFlow: organiza tus proyectos, tareas y horarios universitarios.')}"></head>
  <body data-page="dashboard">
    <a class="skip-link" href="#contenido">Ir al contenido</a>
    <header th:replace="~{fragments/layout :: nav}"></header>

    <main id="contenido" class="page-shell">
      <section class="page-heading" aria-labelledby="dashboard-title">
        <div>
          <p class="eyebrow" id="dashboard-date">Miércoles, 12 de agosto</p>
          <h1 id="dashboard-title">Hola, <span data-user-first-name>Estudiante</span></h1>
          <p class="mt-2 text-muted">Tu agenda y el avance de tus proyectos, en un solo lugar.</p>
        </div>
        <div class="flex flex-wrap gap-2.5">
          <a class="btn btn-secondary" th:href="@{/horarios}" href="/horarios"><i class="bi bi-calendar-plus"></i> Mi horario</a>
          <a class="btn btn-primary" th:href="@{/proyectos/nuevo}" href="/proyectos/nuevo"><i class="bi bi-plus-lg"></i> Nuevo proyecto</a>
        </div>
      </section>

      <section class="dashboard-overview">
        <div class="panel">
          <div class="section-head flex-wrap">
            <div>
              <h2>Tu agenda académica</h2>
              <p>Una vista de los compromisos de todos tus proyectos.</p>
            </div>
            <div class="project-legend" id="project-legend" aria-label="Proyectos en el calendario"></div>
          </div>
          <div id="dashboard-calendar" aria-label="Calendario semanal de tareas"></div>
        </div>

        <aside class="panel project-overview" aria-labelledby="projects-snapshot-title">
          <div class="section-head">
            <div><h2 id="projects-snapshot-title">Estado general</h2><p id="pending-count">Cargando tus pendientes…</p></div>
            <a class="text-action" th:href="@{/proyectos}" href="/proyectos" aria-label="Ver todos los proyectos"><i class="bi bi-arrow-up-right" aria-hidden="true"></i></a>
          </div>
          <div id="project-snapshot-list" class="overview-projects" aria-live="polite"></div>
        </aside>
      </section>
    </main>

    <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
    <script th:src="@{/js/dashboard.js}" src="/js/dashboard.js" defer></script>
  </body>
</html>
