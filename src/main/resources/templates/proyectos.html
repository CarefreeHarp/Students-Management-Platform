<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head('Mis proyectos', 'Gestiona tus proyectos académicos en StudyFlow.')}"></head>
  <body data-page="projects">
    <a class="skip-link" href="#contenido">Ir al contenido</a>
    <header th:replace="~{fragments/layout :: nav}"></header>

    <main id="contenido" class="page-shell">
      <section class="page-heading" aria-labelledby="projects-title">
        <div>
          <p class="eyebrow"><i class="bi bi-kanban"></i> Espacio de trabajo</p>
          <h1 id="projects-title">Mis proyectos</h1>
          <p class="mt-2 text-muted">Visualiza el avance de cada entrega y continúa donde lo dejaste.</p>
        </div>
        <a class="btn btn-primary" th:href="@{/proyectos/nuevo}" href="/proyectos/nuevo">
          <i class="bi bi-plus-lg" aria-hidden="true"></i> Crear proyecto
        </a>
      </section>

      <section class="mb-6 grid gap-4 sm:grid-cols-3" aria-label="Resumen de proyectos">
        <article class="summary-card">
          <span class="summary-icon"><i class="bi bi-collection"></i></span>
          <div><strong id="total-projects">0</strong><span>proyectos activos</span></div>
        </article>
        <article class="summary-card summary-card--blue">
          <span class="summary-icon"><i class="bi bi-check2-circle"></i></span>
          <div><strong id="completed-tasks">0</strong><span>tareas completadas</span></div>
        </article>
        <article class="summary-card summary-card--orange">
          <span class="summary-icon"><i class="bi bi-calendar-event"></i></span>
          <div><strong id="next-deadline">—</strong><span>próxima entrega</span></div>
        </article>
      </section>

      <section class="mb-5 flex flex-wrap items-center justify-between gap-3" aria-label="Herramientas de proyectos">
        <label class="input-wrap w-[min(340px,100%)]" for="project-search">
          <i class="bi bi-search" aria-hidden="true"></i>
          <span class="sr-only">Buscar proyecto</span>
          <input id="project-search" type="search" autocomplete="off" placeholder="Buscar por nombre o integrante">
        </label>
        <div class="flex gap-1.5 rounded-[12px] border border-line bg-white p-1" role="group" aria-label="Filtrar proyectos">
          <button class="filter-button btn btn-sm btn-ghost is-active" type="button" data-filter="all">Todos</button>
          <button class="filter-button btn btn-sm btn-ghost" type="button" data-filter="active">En curso</button>
          <button class="filter-button btn btn-sm btn-ghost" type="button" data-filter="completed">Finalizados</button>
        </div>
      </section>

      <section aria-labelledby="project-grid-title">
        <div class="section-heading">
          <h2 id="project-grid-title">Tus espacios de trabajo</h2>
          <span id="project-count-label" class="text-[13px] text-muted">0 proyectos</span>
        </div>
        <div id="projects-grid" class="projects-grid" aria-live="polite"></div>
      </section>
    </main>

    <template id="project-card-template">
      <article class="project-card">
        <a class="project-card-link block" href="#" aria-label="Abrir proyecto">
          <div class="project-card-topline">
            <span class="project-color-dot"></span>
            <span class="project-state"></span>
            <i class="bi bi-arrow-up-right" aria-hidden="true"></i>
          </div>
          <h3 class="project-name"></h3>
          <p class="project-description"></p>
          <div class="project-meta">
            <span><i class="bi bi-calendar3"></i><time class="project-deadline"></time></span>
            <span><i class="bi bi-list-check"></i><span class="project-task-count"></span></span>
          </div>
          <div class="project-progress-copy"><span>Avance total</span><strong class="project-progress-value"></strong></div>
          <div class="progress-track" aria-hidden="true"><span class="progress-fill"></span></div>
          <div class="project-card-footer">
            <div class="member-stack" aria-label="Integrantes"></div>
            <span class="open-project">Ver proyecto <i class="bi bi-arrow-right"></i></span>
          </div>
        </a>
      </article>
    </template>

    <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
    <script th:src="@{/js/proyectos.js}" src="/js/proyectos.js" defer></script>
  </body>
</html>
