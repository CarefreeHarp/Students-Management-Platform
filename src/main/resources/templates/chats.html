<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head('Chats', 'Conversa con tu equipo dentro de StudyFlow y obtén resúmenes automáticos.')}"></head>
  <body data-page="chats">
    <a class="skip-link" href="#contenido">Ir al contenido</a>
    <header th:replace="~{fragments/layout :: nav}"></header>

    <main id="contenido" class="page-shell">
      <section class="page-heading" aria-labelledby="chats-title">
        <div>
          <p class="eyebrow"><i class="bi bi-chat-dots"></i> Trabajo en equipo</p>
          <h1 id="chats-title">Canales</h1>
          <p class="mt-2 max-w-[62ch] text-muted">
            Cada proyecto se divide en canales: uno general y uno por cada tarea o tema.
          </p>
        </div>
        <a class="btn btn-primary" th:href="@{/proyectos/nuevo}" href="/proyectos/nuevo"><i class="bi bi-plus-lg"></i> Nuevo proyecto</a>
      </section>

      <section aria-labelledby="chat-list-title">
        <div class="section-heading">
          <h2 id="chat-list-title">Tus espacios de equipo</h2>
          <span id="chat-count" class="text-[13px] text-muted">0 canales</span>
        </div>
        <div id="chats-grid" class="projects-grid" aria-live="polite"></div>
      </section>
    </main>

    <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
    <script th:src="@{/js/chats.js}" src="/js/chats.js" defer></script>
  </body>
</html>
